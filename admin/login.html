<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة | Test For You</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #0F2B46;
            --primary-dark: #081B30;
            --accent: #C9A227;
            --accent-light: #E8C76B;
            --surface: #FFFFFF;
            --bg-light: #F4F6FA;
            --text-dark: #0F172A;
            --text-muted: #5A6B7D;
            --border: #E1E7EF;
            --radius-lg: 20px;
            --shadow-lg: 0 20px 60px rgba(15, 43, 70, .15);
        }

        body {
            font-family: "Cairo", sans-serif;
            background: linear-gradient(135deg, #0F2B46 0%, #081B30 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 40px;
            max-width: 420px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .login-header h3 {
            color: var(--primary);
            font-weight: 900;
            margin-bottom: 5px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        .form-control {
            height: 50px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            padding-right: 15px;
            font-weight: 600;
            background: var(--bg-light);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(201, 162, 39, 0.1);
            background: #fff;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .input-icon .form-control {
            padding-right: 45px;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: 0;
            border-radius: 12px;
            padding: 12px;
            font-weight: 800;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(15, 43, 70, 0.4);
        }

        .error-alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            border-radius: 12px;
            padding: 10px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 15px;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <img src="/img/logo 2.jpeg" alt="logo">
            <h3>Test For You</h3>
            <p>لوحة تحكم الإدارة</p>
        </div>

        <div id="errorMsg" class="error-alert d-none"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-bold">البريد الإلكتروني</label>
                <div class="input-icon">
                    <i class="bi bi-envelope"></i>
                    <input type="email" id="email" class="form-control" placeholder="admin@example.com" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">كلمة المرور</label>
                <div class="input-icon">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="********" required>
                </div>
            </div>
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i> تسجيل الدخول
            </button>
        </form>

        <div class="footer-text">
            © 2025 Test For You
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const errorEl = document.getElementById('errorMsg');
            errorEl.classList.add('d-none');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorEl.textContent = data.error || 'خطأ في تسجيل الدخول';
                    errorEl.classList.remove('d-none');
                    return;
                }

                localStorage.setItem('adminToken', data.token);
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorEl.textContent = 'تعذر الاتصال بالخادم';
                errorEl.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
