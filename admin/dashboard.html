<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #0F2B46;
            --primary-dark: #081B30;
            --accent: #C9A227;
            --accent-light: #E8C76B;
            --surface: #FFFFFF;
            --bg-light: #F4F6FA;
            --text-dark: #0F172A;
            --text-muted: #5A6B7D;
            --border: #E1E7EF;
            --success: #10B981;
            --danger: #EF4444;
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 24px;
            --shadow-sm: 0 2px 12px rgba(15, 43, 70, .07);
            --shadow-md: 0 8px 32px rgba(15, 43, 70, .1);
            --shadow-lg: 0 20px 60px rgba(15, 43, 70, .15);
            --sidebar-width: 270px;
            --transition: .35s cubic-bezier(.4, 0, .2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
        }

        /* ========== Sidebar ========== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            padding: 25px 20px;
            z-index: 1000;
            transition: right .4s ease;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
        }

        /* على الشاشات الكبيرة، القائمة ظاهرة دائمًا */
        @media (min-width: 992px) {
            .sidebar {
                right: 0;
            }
        }

        /* على الموبايل، القائمة مخفية افتراضيًا */
        @media (max-width: 991px) {
            .sidebar {
                right: calc(-1 * var(--sidebar-width));
                /* إخفاء خارج الشاشة */
            }

            .sidebar.open {
                right: 0;
                /* إظهار عند فتح القائمة */
            }
        }


        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, .1);
            margin-bottom: 25px;
        }

        .sidebar-logo img {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            object-fit: cover;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
        }

        .sidebar-logo .logo-text {
            font-size: 1.15rem;
            font-weight: 900;
            line-height: 1.3;
        }

        .sidebar-logo .logo-text span {
            color: var(--accent-light);
        }

        /* زر الإغلاق (X) - أبيض */
        .sidebar-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .2s, transform .2s;
            z-index: 1100;
        }

        .sidebar-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        /* إخفاء زر الإغلاق افتراضيًا */
        .sidebar-close {
            display: none;
        }

        /* إظهار زر الإغلاق فقط على الموبايل عندما تكون القائمة مفتوحة */
        @media (max-width: 991px) {
            .sidebar.open .sidebar-close {
                display: flex;
            }
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: rgba(255, 255, 255, .8);
            font-weight: 700;
            font-size: .9rem;
            border-radius: 12px;
            transition: var(--transition);
            margin-bottom: 5px;
        }

        .sidebar-menu li a:hover {
            background: rgba(255, 255, 255, .1);
            color: #fff;
        }

        .sidebar-menu li a.active {
            background: rgba(201, 162, 39, .2);
            color: var(--accent-light);
            border-left: 3px solid var(--accent);
        }

        .sidebar-menu li a i {
            font-size: 1.2rem;
        }

        .sidebar-footer {
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, .1);
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, .8);
            font-weight: 600;
            font-size: .9rem;
            padding: 10px 15px;
            border-radius: 12px;
            transition: var(--transition);
        }

        .sidebar-footer a:hover {
            background: rgba(255, 255, 255, .1);
            color: var(--danger);
        }

        /* ========== Main Content ========== */
        .main-content {
            margin-right: var(--sidebar-width);
            padding: 30px;
            min-height: 100vh;
            transition: margin-right .4s ease;
        }

        /* على الموبايل، المحتوى ياخد كامل الشاشة */
        @media (max-width: 991px) {
            .main-content {
                margin-right: 0;
            }
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 15px 25px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .main-header h4 {
            font-weight: 800;
            margin: 0;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-header .admin-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .main-header .admin-name {
            font-weight: 700;
            font-size: .9rem;
            color: var(--text-dark);
        }

        /* زر القائمة (3 شرط) - يظهر فقط على الموبايل */
        .btn-toggle {
            display: none;
            background: var(--bg-light);
            border: 0;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary);
        }

        @media (max-width: 991px) {
            .btn-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }

        /* ========== Stats Cards ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            border-right: 4px solid var(--accent);
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .stat-card .stat-icon {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            background: rgba(201, 162, 39, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .stat-card .stat-number {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--text-dark);
            line-height: 1;
        }

        .stat-card .stat-label {
            color: var(--text-muted);
            font-size: .9rem;
            margin-top: 5px;
            font-weight: 600;
        }

        /* ========== Table Card ========== */
        .table-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .table-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
            border: 0;
            background: transparent;
            padding: 0;
        }

        .table-card .card-header h5 {
            font-weight: 800;
            margin: 0;
            color: var(--primary);
        }

        .search-box {
            position: relative;
            width: 250px;
        }

        .search-box input {
            height: 42px;
            border-radius: 25px;
            border: 1.5px solid var(--border);
            padding-right: 40px;
            font-size: .9rem;
            background: var(--bg-light);
            width: 100%;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(201, 162, 39, .1);
            background: #fff;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .btn-add {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: var(--primary-dark);
            border: 0;
            border-radius: 25px;
            padding: 8px 20px;
            font-weight: 800;
            font-size: .9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 162, 39, .4);
        }

        .table {
            margin: 0;
        }

        .table thead th {
            font-weight: 800;
            color: var(--text-muted);
            font-size: .85rem;
            border-bottom: 2px solid var(--border);
            padding: 15px 10px;
            background: var(--bg-light);
        }

        .table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background .2s;
        }

        .table tbody tr:hover {
            background: rgba(201, 162, 39, .04);
        }

        .table tbody td {
            padding: 15px 10px;
            vertical-align: middle;
        }

        .img-box {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: var(--shadow-sm);
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 25px;
            font-size: .8rem;
            font-weight: 700;
        }

        .status-available {
            background: rgba(16, 185, 129, .12);
            color: var(--success);
        }

        .status-unavailable {
            background: rgba(100, 116, 139, .12);
            color: var(--text-muted);
        }

        .status-sold {
            background: rgba(239, 68, 68, .12);
            color: var(--danger);
        }

        .status-rented {
            background: rgba(245, 166, 35, .12);
            color: var(--accent);
        }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .btn-icon {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            border: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all .2s;
            cursor: pointer;
        }

        .btn-edit {
            background: rgba(13, 110, 253, .1);
            color: #0d6efd;
        }

        .btn-edit:hover {
            background: #0d6efd;
            color: #fff;
        }

        .btn-delete {
            background: rgba(239, 68, 68, .1);
            color: var(--danger);
        }

        .btn-delete:hover {
            background: var(--danger);
            color: #fff;
        }

        /* ========== Modal ========== */
        .modal-content {
            border-radius: var(--radius-lg);
            border: 0;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            background: var(--primary);
            color: #fff;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            padding: 20px 25px;
            border: 0;
        }

        .modal-header .btn-close {
            filter: invert(1);
        }

        .modal-body {
            padding: 30px;
        }

        .modal-footer {
            border-top: 1px solid var(--border);
            padding: 15px 25px;
        }

        .form-label {
            font-weight: 700;
            font-size: .9rem;
        }

        .form-control,
        .form-select {
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            padding: 10px 15px;
            font-weight: 600;
            background: var(--bg-light);
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(201, 162, 39, .1);
            background: #fff;
        }

        .btn-save {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: var(--primary-dark);
            border: 0;
            border-radius: 10px;
            padding: 10px 25px;
            font-weight: 800;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 162, 39, .3);
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <!-- زر الإغلاق (X) - يظهر فقط عندما تكون القائمة مفتوحة على الموبايل -->
        <button class="sidebar-close" onclick="toggleSidebar()" title="إغلاق القائمة">
            <i class="bi bi-x-lg"></i>
        </button>

        <div class="sidebar-logo">
            <img src="/img/logo 2.jpeg" alt="logo">
            <div class="logo-text">Test <br><span>For You</span></div>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#" class="active"><i class="bi bi-speedometer2"></i> لوحة التحكم</a></li>
            <li><a href="#" onclick="openAddModal()"><i class="bi bi-plus-circle"></i> إضافة عقار</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> تسجيل الخروج</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="main-header">
            <div style="display:flex; align-items:center; gap:15px;">
                <!-- زر الـ 3 شرط (Hamburger) - يظهر فقط على الموبايل -->
                <button class="btn-toggle" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <h4><i class="bi bi-speedometer2"></i> لوحة التحكم</h4>
            </div>
            <div class="admin-info">
                <span class="admin-name" id="adminName">مدير الموقع</span>
                <div
                    style="width:40px; height:40px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; color:white; font-weight:800;">
                    <i class="bi bi-person-fill"></i>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="bi bi-building"></i></div>
                <div class="stat-number" id="totalProps">0</div>
                <div class="stat-label">إجمالي العقارات</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="bi bi-check-circle"></i></div>
                <div class="stat-number" id="availProps">0</div>
                <div class="stat-label">متاحة</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="bi bi-star"></i></div>
                <div class="stat-number" id="featProps">0</div>
                <div class="stat-label">مميزة</div>
            </div>
        </div>

        <!-- Properties Table -->
        <div class="table-card">
            <div class="card-header">
                <h5><i class="bi bi-list-ul me-2"></i> إدارة العقارات</h5>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="بحث بالعنوان أو الموقع...">
                    </div>
                    <button class="btn-add" onclick="openAddModal()"><i class="bi bi-plus-lg"></i> إضافة عقار</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>العنوان</th>
                            <th>الموقع</th>
                            <th>السعر</th>
                            <th>الحالة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Property -->
    <div class="modal fade" id="propertyModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">إضافة عقار جديد</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="propertyForm">
                        <input type="hidden" id="propId" name="id">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">العنوان</label>
                                <input type="text" class="form-control" id="f_title" name="title" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">السعر (جنيه)</label>
                                <input type="number" class="form-control" id="f_price" name="price" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">نوع العقار</label>
                                <select class="form-select" id="f_type" name="type">
                                    <option value="apartment">شقة</option>
                                    <option value="villa">فيلا</option>
                                    <option value="chalet">شاليه</option>
                                    <option value="office">مكتب</option>
                                    <option value="shop">محل تجاري</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">الغرض</label>
                                <select class="form-select" id="f_purpose" name="purpose">
                                    <option value="sale">بيع</option>
                                    <option value="rent">إيجار</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">الموقع</label>
                                <input type="text" class="form-control" id="f_location" name="location">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">المساحة (م²)</label>
                                <input type="number" class="form-control" id="f_area" name="area">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">غرف النوم</label>
                                <input type="number" class="form-control" id="f_bedrooms" name="bedrooms">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">الحمامات</label>
                                <input type="number" class="form-control" id="f_bathrooms" name="bathrooms">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">الحالة</label>
                                <select class="form-select" id="f_status" name="status">
                                    <option value="available">متاح</option>
                                    <option value="unavailable">غير متاح</option>
                                    <option value="sold">تم البيع</option>
                                    <option value="rented">تم الايجار</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">مميز</label>
                                <select class="form-select" id="f_featured" name="is_featured">
                                    <option value="0">لا</option>
                                    <option value="1">نعم</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ترتيب</label>
                                <input type="number" class="form-control" id="f_sort" name="sort_order" value="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">الدور</label>
                                <input type="text" class="form-control" id="f_floor" name="floor">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">رابط فيسبوك (اختياري)</label>
                                <input type="url" class="form-control" id="f_facebook" name="facebook"
                                    placeholder="https://facebook.com/...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">رابط يوتيوب (اختياري)</label>
                                <input type="url" class="form-control" id="f_youtube" name="youtube"
                                    placeholder="https://youtube.com/...">
                            </div>
                            <div class="col-12">
                                <label class="form-label">الوصف</label>
                                <textarea class="form-control" id="f_description" name="description"
                                    rows="3"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">الصور (اختر عدة صور، الأولى ستكون صورة الغلاف)</label>
                                <input type="file" class="form-control" id="f_images" name="images" accept="image/*"
                                    multiple>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn-save" onclick="saveProperty()"><i class="bi bi-floppy me-1"></i>
                        حفظ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>

</html>
